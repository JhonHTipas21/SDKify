name: Spec Watch & Regression Detection

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      spec_url:
        description: 'URL of the OpenAPI spec to watch'
        required: true
        default: 'https://raw.githubusercontent.com/wompi/docs/main/openapi.yaml'
      spec_name:
        description: 'Name of the provider (e.g. wompi)'
        required: true
        default: 'wompi'

permissions:
  contents: read

jobs:
  check-specs:
    name: Check Specs & Detect Breaking Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check_changes.outputs.changed }}
      diff_exit: ${{ steps.semantic_diff.outputs.diff_exit }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Define Spec Context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "SPEC_URL=${{ github.event.inputs.spec_url }}" >> $GITHUB_ENV
            echo "SPEC_NAME=${{ github.event.inputs.spec_name }}" >> $GITHUB_ENV
          else
            # Default fallback for scheduled runs
            echo "SPEC_URL=https://raw.githubusercontent.com/wompi/docs/main/openapi.yaml" >> $GITHUB_ENV
            echo "SPEC_NAME=wompi" >> $GITHUB_ENV
          fi

      - name: Download Spec Safely
        id: download_spec
        run: |
          mkdir -p fixtures/specs
          mkdir -p fixtures/snapshots
          
          # Use curl with timeouts and size limits
          curl -sS --max-time 30 --max-filesize 10000000 "$SPEC_URL" -o fixtures/specs/$SPEC_NAME.yaml
          
          # Generate hash
          HASH=$(sha256sum fixtures/specs/$SPEC_NAME.yaml | awk '{ print $1 }')
          echo "CURRENT_HASH=$HASH" >> $GITHUB_ENV
          
          OLD_HASH=""
          if [ -f fixtures/snapshots/$SPEC_NAME.hash ]; then
            OLD_HASH=$(cat fixtures/snapshots/$SPEC_NAME.hash)
          fi
          echo "OLD_HASH=$OLD_HASH" >> $GITHUB_ENV

      - name: Check for Spec Changes
        id: check_changes
        run: |
          if [ "$CURRENT_HASH" == "$OLD_HASH" ]; then
            echo "No changes detected for $SPEC_NAME. Skipping."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected!"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Detect Semantic Changes
        if: steps.check_changes.outputs.changed == 'true'
        id: semantic_diff
        run: |
          # Fetch the previously saved spec from git if we have an old hash
          if [ -n "$OLD_HASH" ]; then
            git fetch origin main
            git checkout origin/main -- fixtures/specs/$SPEC_NAME.yaml || true
            mv fixtures/specs/$SPEC_NAME.yaml fixtures/specs/${SPEC_NAME}_old.yaml
          else
            # No old spec to compare
            echo "No old spec to compare. Exiting diff step."
            echo "diff_exit=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Put new spec back in place
          curl -sS --max-time 30 "$SPEC_URL" -o fixtures/specs/$SPEC_NAME.yaml
          
          # Run Semantic Comparison (compare-specs.ts)
          npx tsx scripts/compare-specs.ts --old fixtures/specs/${SPEC_NAME}_old.yaml --new fixtures/specs/$SPEC_NAME.yaml > diff_report.json || EXIT_CODE=$?
          
          echo "diff_exit=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Save new hash (Artifact for next job)
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "$CURRENT_HASH" > fixtures/snapshots/$SPEC_NAME.hash
          mkdir -p artifacts
          cp diff_report.json artifacts/ || echo '{"breaking": [], "nonBreaking": [], "unknown": []}' > artifacts/diff_report.json
          cp fixtures/snapshots/$SPEC_NAME.hash artifacts/

      - name: Upload Artifacts
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spec-watch-artifacts
          path: artifacts/

  act-on-changes:
    name: Act on Changes (Create Issue / PR)
    needs: check-specs
    if: needs.check-specs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: spec-watch-artifacts
          path: artifacts

      - name: Parse Diff Exit Code and Content
        id: parse_diff
        run: |
          # diff_exit from previous job
          DIFF_EXIT=${{ needs.check-specs.outputs.diff_exit }}
          echo "diff_exit=$DIFF_EXIT" >> $GITHUB_OUTPUT
          
          # Format JSON report to Markdown if exists
          if [ -f artifacts/diff_report.json ]; then
             echo "report_exists=true" >> $GITHUB_OUTPUT
          else
             echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run SDKify for Non-Breaking Updates
        if: steps.parse_diff.outputs.diff_exit == '2'
        run: |
          npm ci
          # Regenerate SDK without AI
          npx tsx src/cli/index.ts --spec fixtures/specs/${SPEC_NAME}.yaml --output fixtures/generated-sdks/${SPEC_NAME}-sdk --no-ai
          
          # Update hashes
          cp artifacts/$SPEC_NAME.hash fixtures/snapshots/

      - name: Create Pull Request (Non-Breaking)
        if: steps.parse_diff.outputs.diff_exit == '2'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update SDK for ${{ github.event.inputs.spec_name || 'wompi' }}"
          title: "Update SDK for ${{ github.event.inputs.spec_name || 'wompi' }}"
          body: "The upstream OpenAPI specification was updated. No breaking changes were found. Please review the regenerated SDK."
          branch: "update-sdk-${{ github.event.inputs.spec_name || 'wompi' }}"
          labels: "sdk-update, automated"

      - name: Create Breaking Change Issue
        if: steps.parse_diff.outputs.diff_exit == '1' && steps.parse_diff.outputs.report_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('artifacts/diff_report.json', 'utf8'));
            
            let markdown = `The upstream OpenAPI specification has been updated, and **potential breaking or unknown changes** were detected.\n\n`;
            
            if (report.breaking.length > 0) {
              markdown += `### 🚨 Breaking Changes\n`;
              report.breaking.forEach(c => markdown += `- **${c.path}**: ${c.message}\n`);
            }
            if (report.unknown.length > 0) {
              markdown += `\n### ⚠️ Unknown Changes (Manual review required)\n`;
              report.unknown.forEach(c => markdown += `- **${c.path}**: ${c.message}\n`);
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 API Specification Change Detected`,
              body: markdown,
              labels: ['breaking-change']
            });
