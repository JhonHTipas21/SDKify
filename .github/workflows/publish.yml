name: Build and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  validate-and-test:
    name: Validate, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit
        run: npm audit --audit-level=moderate
        continue-on-error: true # Warning only for now

      - name: Build project
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Validate OpenAPI spec fixture
        run: npm run validate-spec

      - name: Run unit tests with Vitest
        run: npm run test:coverage

      - name: Verify build artifact contents (Dry run)
        run: |
          npm pack --dry-run > pack-output.txt
          cat pack-output.txt
          # Fail if secrets or unwanted files are in the tarball
          if grep -qE "\.env|fixtures/specs/.*\.yaml|fixtures/snapshots" pack-output.txt; then
            echo "::error::Unwanted files (secrets or raw fixtures) detected in npm pack output!"
            exit 1
          fi

  publish:
    name: Semantic Release Publish
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jhonhtipas21'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
